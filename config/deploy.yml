# Kamal 2 — corpus-damana on our own server (netcup), next to the other
# apps and behind the same kamal-proxy. Same pattern as cesar-travel and
# board-checkup: the image is built in GitHub Actions, published to GHCR
# and Kamal goes in over SSH as `deploy` to start it. No panel is left on
# the server; only kamal-proxy and the containers.
service: corpus-damana
# ONLY owner/repo: Kamal prepends registry.server. Writing it in full leaves the
# image at ghcr.io/ghcr.io/…
image: juancarlosguti/corpus-damana

# The IP is not versioned (public repo): it comes from the SERVER_IP variable, which
# in GitHub Actions is the secret of the same name. Locally:
#   SERVER_IP=<ip> kamal deploy
servers:
  web:
    - <%= ENV.fetch("SERVER_IP") %>

# Root access is disabled on the server.
ssh:
  user: deploy

proxy:
  # Subdomain of the domain that already serves crearcodecesar.com and
  # app.crearcodecesar.com. It is a separate A record and kamal-proxy routes by
  # name: it neither touches nor affects the other sites. DNS on Cloudflare with the
  # proxy OFF (grey cloud): with the orange cloud Let's Encrypt cannot
  # complete the challenge and there is no certificate. The record must resolve
  # to this IP BEFORE the first deploy.
  host: damana.crearcodecesar.com
  # Let's Encrypt certificate that kamal-proxy requests by itself; it also redirects
  # http → https.
  ssl: true
  # Declared even though it is the default value with ssl: true. The app limits
  # login attempts per IP (`trust proxy` in backend/src/main.ts), so
  # X-Forwarded-For must be written by kamal-proxy, not by the client.
  forward_headers: false
  app_port: 3000
  healthcheck:
    # Public and lightweight (backend/src/health/health.controller.ts). It answers 503
    # if the image came out without a corpus, and then the deployment fails instead
    # of replacing the previous container.
    path: /api/health
    interval: 5
    timeout: 15

# Startup is just opening the already baked database and starting Nest: seconds.
deploy_timeout: 120

registry:
  server: ghcr.io
  username: juancarlosguti
  password:
    - KAMAL_REGISTRY_PASSWORD

# The image is built on the GitHub runner, NOT on the server: the Angular
# build can peak at 2-4 GB and would take the box down with all the apps
# on it. The layer cache lives in GHCR, as in cesar-travel: `npm ci` and the
# apt-get are reused across deployments that do not touch dependencies.
builder:
  arch: amd64
  context: .
  dockerfile: Dockerfile
  cache:
    type: registry
    options: mode=max
    image: juancarlosguti/corpus-damana-build-cache

env:
  clear:
    # The Dockerfile already declares it; it is repeated because auth being
    # mandatory depends on it (auth.config.ts) and it is good to see it next to the rest.
    NODE_ENV: production
    PORT: "3000"
    # Claude reasoning effort (owner's decision, 22 Oct 2026):
    # low cuts output tokens and latency; the prompt already carries the
    # dictionary, the rules and the examples, so long reasoning
    # adds little. It only applies to Claude; Groq does not read it.
    ANTHROPIC_EFFORT: low
    # Main translation engine: Claude (ANTHROPIC_API_KEY in `secret`,
    # takes priority). Groq stays as a fallback: it is only used if the
    # Anthropic key is missing.
    TRANSLATOR_BASE_URL: https://api.groq.com/openai/v1
    TRANSLATOR_MODEL: openai/gpt-oss-120b
  secret:
    # Claude (claude-opus-5-5 by default; Max plan API credits).
    - ANTHROPIC_API_KEY
    # Fallback: Groq key.
    - TRANSLATOR_API_KEY
    # Single app user. Without these two the service does NOT start in
    # production, on purpose.
    - AUTH_USERNAME
    - AUTH_PASSWORD
    # Session signing (30 days). Changing it logs out every
    # device.
    - AUTH_JWT_SECRET
