<section class="input">
  <h1>dʉmʉna</h1>
  <p class="muted">Corpus damana — acceso privado</p>

  <form class="panel form" (ngSubmit)="submit()">
    <label>
      Usuario
      <input
        type="text"
        name="username"
        autocomplete="username"
        autocapitalize="none"
        [ngModel]="user()"
        (ngModelChange)="user.set($event)"
        required
      />
    </label>

    <label>
      Contraseña
      <input
        type="password"
        name="password"
        autocomplete="current-password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        required
      />
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button class="button" type="submit" [disabled]="signingIn()">
      {{ signingIn() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</section>
