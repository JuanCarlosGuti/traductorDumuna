<header class="cabecera">
  <span class="logo">dʉmʉna</span>
  <nav>
    <a routerLink="/buscar" routerLinkActive="activo">Buscar</a>
    <a routerLink="/diccionario" routerLinkActive="activo">Diccionario</a>
    <a routerLink="/gramatica" routerLinkActive="activo">Gramática</a>
    <a routerLink="/flashcards" routerLinkActive="activo">Flashcards</a>
    <a routerLink="/traductor" routerLinkActive="activo">Traductor</a>
  </nav>
  @if (usuario(); as quien) {
    <span class="sesion">
      <span class="suave">{{ quien }}</span>
      <button type="button" class="boton-suave" (click)="salir()">Salir</button>
    </span>
  }
</header>

<main class="contenido">
  <router-outlet />
</main>
