<header class="header">
  <span class="logo">dʉmʉna</span>
  <nav>
    <a routerLink="/buscar" routerLinkActive="active">Buscar</a>
    <a routerLink="/diccionario" routerLinkActive="active">Diccionario</a>
    <a routerLink="/gramatica" routerLinkActive="active">Gramática</a>
    <a routerLink="/flashcards" routerLinkActive="active">Flashcards</a>
    <a routerLink="/traductor" routerLinkActive="active">Traductor</a>
    <a routerLink="/pendientes" routerLinkActive="active">Pendientes</a>
  </nav>
  @if (user(); as who) {
    <span class="session">
      <span class="muted">{{ who }}</span>
      <button type="button" class="button-muted" (click)="signOut()">Salir</button>
    </span>
  }
</header>

<main class="content">
  <router-outlet />
</main>
