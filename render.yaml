# Blueprint de Render (plan gratuito): en render.com → New → Blueprint → elegir este repo.
#
# El proyecto es un monorepo con npm workspaces (package-lock único en la raíz), así que
# TODO corre desde la raíz con los scripts del package.json raíz:
#   - build:      compila Angular (→ backend/public) y el backend Nest
#   - importar:   regenera datos/corpus.db desde los CSV (corpus.db no se versiona; el
#                 runtime la lee en solo-lectura → el filesystem efímero de Render sirve)
#   - start:prod: node dist/main.js con cwd en backend/ (así '../datos' resuelve bien)
#
# Motor de traducción: Groq (API compatible con OpenAI). TRADUCTOR_API_KEY se pide al crear
# el servicio (sync: false = secreto, nunca en el repo).
#
# Autenticación: usuario único. AUTH_USUARIO y AUTH_PASSWORD son secretos que se
# introducen en el panel; SIN ELLOS EL SERVICIO NO ARRANCA en producción, a propósito
# (una API abierta por descuido no se nota; un arranque fallido sí).
#
# Plan gratis: el servicio se "duerme" tras ~15 min sin visitas; la siguiente petición
# tarda ~30-60s en despertarlo.

services:
  - type: web
    name: corpus-damana
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && npm run importar
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      # OJO: no poner NODE_ENV=production aquí. `npm ci` lo interpreta como
      # --omit=dev y se dejaría fuera @nestjs/cli, ng y ts-node, que son los
      # que construyen e importan. El código detecta el despliegue por la
      # variable RENDER, que la plataforma define sola.
      - key: TRADUCTOR_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: TRADUCTOR_MODELO
        value: llama-3.3-70b-versatile
      - key: TRADUCTOR_API_KEY
        sync: false
      - key: AUTH_USUARIO
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      # Generado por Render una sola vez y estable después: si cambiara en cada
      # despliegue, cada deploy cerraría la sesión en todos los dispositivos.
      - key: AUTH_JWT_SECRET
        generateValue: true
