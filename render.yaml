# Render Blueprint (free plan): on render.com → New → Blueprint → choose this repo.
#
# The project is a monorepo with npm workspaces (single package-lock at the root), so
# EVERYTHING runs from the root with the root package.json scripts:
#   - build:      compiles Angular (→ backend/public) and the Nest backend
#   - importar:   regenerates datos/corpus.db from the CSVs (corpus.db is not versioned; the
#                 runtime reads it read-only → Render's ephemeral filesystem is fine)
#   - start:prod: node dist/main.js with cwd in backend/ (so '../datos' resolves properly)
#
# Translation engine: Claude (ANTHROPIC_API_KEY, priority; claude-opus-5-5 by default,
# with the Max plan API credits). Groq stays as a fallback: it is only used if the
# Anthropic key is missing. Keys are requested when creating the service (sync: false = secret,
# never in the repo).
#
# Authentication: single user. AUTH_USUARIO and AUTH_PASSWORD are secrets
# entered in the dashboard; WITHOUT THEM THE SERVICE DOES NOT START in production, on purpose
# (an API left open by accident goes unnoticed; a failed startup does not).
#
# Free plan: the service "sleeps" after ~15 min without visits; the next request
# takes ~30-60s to wake it up.

services:
  - type: web
    name: corpus-damana
    runtime: node
    plan: free
    # traer-datos copies the real corpus from the private repo if both
    # CORPUS_DATOS_* variables are set; without them the service ships with the repo's
    # sample corpus (see DATA.md).
    buildCommand: npm ci && node scripts/traer-datos.mjs && npm run build && npm run importar
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      # CAREFUL: do not set NODE_ENV=production here. `npm ci` reads it as
      # --omit=dev and would leave out @nestjs/cli, ng and ts-node, which are the
      # ones that build and import. The code detects the deployment via the
      # RENDER variable, which the platform sets by itself.
      # Main engine: Claude. It takes priority over Groq
      # (backend/src/translation/translator-config.provider.ts).
      # Private repo with the real corpus ("owner/repo") and a read-only
      # token for it. Optional: without them the sample corpus is used.
      - key: CORPUS_DATOS_REPO
        sync: false
      - key: CORPUS_DATOS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Fallback: Groq, OpenAI-compatible API. It only kicks in if
      # ANTHROPIC_API_KEY is missing.
      - key: TRADUCTOR_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: TRADUCTOR_MODELO
        value: openai/gpt-oss-120b
      - key: TRADUCTOR_API_KEY
        sync: false
      - key: AUTH_USUARIO
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      # Generated by Render only once and stable afterwards: if it changed on every
      # deployment, each deploy would log out every device.
      - key: AUTH_JWT_SECRET
        generateValue: true
