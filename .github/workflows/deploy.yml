name: Tests, image and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (backend, API and frontend) and build
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Monorepo with workspaces and a single package-lock at the root: install
      # from the root or the modules end up where the runtime cannot find them.
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:front
      # Building here, apart from the docker build, makes an Angular error
      # show up in its own step instead of hidden in the Docker output.
      - run: npm run build
      # Playwright (npm run test:browser) does not run here: it needs to download
      # Chromium and takes minutes; it is run locally before pushing.

  image:
    name: Docker (the image builds and ships the SPA and the corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t corpus-damana:ci .
      # What has saved deployments in the other repos: making sure the built
      # Angular app and the imported database are INSIDE the image.
      - name: Check the SPA and corpus inside the image
        run: |
          docker run --rm --entrypoint sh corpus-damana:ci -c \
            'test -f /app/backend/public/index.html && test -s /app/data/corpus.db' \
            || { echo "::error::backend/public/index.html or data/corpus.db is missing from the image"; exit 1; }

  deploy:
    name: Deploy to the own server (Kamal)
    # Depends on ALL the tests; only from main and only on push, never from
    # a PR.
    needs: [tests, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # to publish the image to GHCR with the GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - run: gem install kamal -v "~> 2.0" -N

      - uses: docker/setup-buildx-action@v3

      # The private key is the infra-server one (secret SSH_PRIVATE_KEY); the
      # server only knows the public key.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # No -H and ed25519 only, on purpose: hashed entries and entries of
          # several types make Net::SSH (Kamal's Ruby client) fail
          # with HostKeyMismatch even when the fingerprint is correct.
          ssh-keyscan -t ed25519 "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      # The public repo only versions a sample corpus (see DATA.md). The
      # real corpus lives in a private repo and is copied over data/ here, before
      # Kamal builds the image (builder.context: .). REQUIRED=1:
      # if the secret is missing or the clone fails, the deployment stops instead of
      # publishing the app with the sample corpus.
      - name: Fetch the real corpus (private data repo)
        env:
          CORPUS_DATA_REPO: ${{ secrets.CORPUS_DATA_REPO || secrets.CORPUS_DATOS_REPO }}
          CORPUS_DATA_TOKEN: ${{ secrets.CORPUS_DATA_TOKEN || secrets.CORPUS_DATOS_TOKEN }}
          CORPUS_DATA_REQUIRED: '1'
        run: node scripts/fetch-data.mjs

      - name: Deploy
        env:
          # config/deploy.yml reads the server IP from here (ERB): the
          # address is not versioned in the public repo.
          SERVER_IP: ${{ secrets.SERVER_IP }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # Claude, the main engine. If the secret were missing it would arrive empty and
          # the app would fall back to Groq (TRANSLATOR_*) on its own.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Secrets created under the old Spanish names keep working as a fallback.
          TRANSLATOR_API_KEY: ${{ secrets.TRANSLATOR_API_KEY || secrets.TRADUCTOR_API_KEY }}
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME || secrets.AUTH_USUARIO }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
        run: kamal deploy
