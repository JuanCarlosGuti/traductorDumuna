name: Pruebas, imagen y despliegue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Pruebas (backend, API y frontend) y build
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Monorepo with workspaces and a single package-lock at the root: install
      # from the root or the modules end up where the runtime cannot find them.
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:front
      # Building here, apart from the docker build, makes an Angular error
      # show up in its own step instead of hidden in the Docker output.
      - run: npm run build
      # Playwright (npm run test:navegador) does not run here: it needs to download
      # Chromium and takes minutes; it is run locally before pushing.

  imagen:
    name: Docker (la imagen construye y trae la SPA y el corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t corpus-damana:ci .
      # What has saved deployments in the other repos: making sure the built
      # Angular app and the imported database are INSIDE the image.
      - name: Verificar SPA y corpus dentro de la imagen
        run: |
          docker run --rm --entrypoint sh corpus-damana:ci -c \
            'test -f /app/backend/public/index.html && test -s /app/datos/corpus.db' \
            || { echo "::error::Falta backend/public/index.html o datos/corpus.db en la imagen"; exit 1; }

  desplegar:
    name: Desplegar al servidor propio (Kamal)
    # Depends on ALL the tests; only from main and only on push, never from
    # un PR.
    needs: [pruebas, imagen]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # to publish the image to GHCR with the GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - run: gem install kamal -v "~> 2.0" -N

      - uses: docker/setup-buildx-action@v3

      # The private key is the infra-servidor one (secret SSH_PRIVATE_KEY); the
      # server only knows the public key.
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # No -H and ed25519 only, on purpose: hashed entries and entries of
          # several types make Net::SSH (Kamal's Ruby client) fail
          # with HostKeyMismatch even when the fingerprint is correct.
          ssh-keyscan -t ed25519 "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      # The public repo only versions a sample corpus (see DATA.md). The
      # real corpus lives in a private repo and is copied over datos/ here, before
      # Kamal builds the image (builder.context: .). OBLIGATORIO=1:
      # if the secret is missing or the clone fails, the deployment stops instead of
      # publishing the app with the sample corpus.
      - name: Traer el corpus real (repo privado de datos)
        env:
          CORPUS_DATOS_REPO: ${{ secrets.CORPUS_DATOS_REPO }}
          CORPUS_DATOS_TOKEN: ${{ secrets.CORPUS_DATOS_TOKEN }}
          CORPUS_DATOS_OBLIGATORIO: '1'
        run: node scripts/traer-datos.mjs

      - name: Desplegar
        env:
          # config/deploy.yml reads the server IP from here (ERB): the
          # address is not versioned in the public repo.
          SERVER_IP: ${{ secrets.SERVER_IP }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # Claude, the main engine. If the secret were missing it would arrive empty and
          # the app would fall back to Groq (TRADUCTOR_*) on its own.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRADUCTOR_API_KEY: ${{ secrets.TRADUCTOR_API_KEY }}
          AUTH_USUARIO: ${{ secrets.AUTH_USUARIO }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
        run: kamal deploy
